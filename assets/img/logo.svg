<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340">
  <defs>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55AAFF"/>
      <stop offset="100%" stop-color="#0040CC"/>
    </linearGradient>
    <clipPath id="cclip">
      <rect x="60" y="66" width="236" height="164" rx="16"/>
    </clipPath>
  </defs>

  <!-- ── Líneas de velocidad (izquierda, fuera del camión) ── -->
  <g stroke="#0066FF" stroke-linecap="round">
    <line x1="4"  y1="106" x2="54" y2="106" stroke-width="9"/>
    <line x1="12" y1="124" x2="57" y2="124" stroke-width="9"/>
    <line x1="4"  y1="141" x2="52" y2="141" stroke-width="8"/>
    <line x1="10" y1="158" x2="55" y2="158" stroke-width="8"/>
    <line x1="4"  y1="174" x2="52" y2="174" stroke-width="7"/>
    <line x1="10" y1="190" x2="55" y2="190" stroke-width="6"/>
    <line x1="4"  y1="205" x2="52" y2="205" stroke-width="6"/>
  </g>

  <!-- ── Caño de escape ── -->
  <rect x="62" y="36" width="20" height="32" rx="5" fill="white" stroke="#0066FF" stroke-width="8"/>

  <!-- ── Área de carga (relleno degradado) ── -->
  <rect x="58" y="66" width="238" height="164" rx="16" fill="url(#cg)"/>

  <!-- Líneas de velocidad dentro del área de carga -->
  <g clip-path="url(#cclip)" stroke="white" stroke-linecap="round">
    <line x1="60" y1="92"  x2="294" y2="92"  stroke-width="7" opacity="0.55"/>
    <line x1="60" y1="110" x2="294" y2="110" stroke-width="6" opacity="0.5"/>
    <line x1="60" y1="127" x2="294" y2="127" stroke-width="5" opacity="0.43"/>
    <line x1="60" y1="143" x2="294" y2="143" stroke-width="4" opacity="0.36"/>
    <line x1="60" y1="158" x2="294" y2="158" stroke-width="3" opacity="0.28"/>
  </g>

  <!-- Texto "logax" -->
  <text x="177" y="200" font-family="Arial, Helvetica, sans-serif"
        font-size="50" font-weight="bold" fill="white"
        text-anchor="middle" letter-spacing="2">logax</text>

  <!-- Borde área de carga -->
  <rect x="58" y="66" width="238" height="164" rx="16" fill="none" stroke="#0066FF" stroke-width="9"/>

  <!-- ── Cabina (blanca con borde azul) ── -->
  <!-- Cuerpo cabina -->
  <path d="M296,66 L432,66 Q456,66 456,90 L456,230 Q456,230 432,230 L296,230 Z"
        fill="white" stroke="#0066FF" stroke-width="9" stroke-linejoin="round"/>
  <!-- Línea divisoria cargo/cabina (cubrir el borde compartido) -->
  <line x1="296" y1="70" x2="296" y2="226" stroke="white" stroke-width="5"/>

  <!-- Parabrisas -->
  <rect x="308" y="96" width="96" height="88" rx="10" fill="none" stroke="#0066FF" stroke-width="8"/>

  <!-- ── Plataforma inferior ── -->
  <rect x="58" y="216" width="398" height="20" rx="6" fill="white" stroke="#0066FF" stroke-width="8"/>

  <!-- ── Ruedas ── -->
  <!-- Rueda izquierda -->
  <circle cx="138" cy="272" r="44" fill="white" stroke="#0066FF" stroke-width="9"/>
  <circle cx="138" cy="272" r="18" fill="none" stroke="#0066FF" stroke-width="7"/>

  <!-- Rueda derecha -->
  <circle cx="370" cy="272" r="44" fill="white" stroke="#0066FF" stroke-width="9"/>
  <circle cx="370" cy="272" r="18" fill="none" stroke="#0066FF" stroke-width="7"/>
</svg>
